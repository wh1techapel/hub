[package]
name = "hub-core"
description = "Hub's domain core: the only code that touches the database (and files' identity on disk). No Tauri, no UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jiff.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
uuid.workspace = true
# Vault copies are checked with SHA-256 (RustCrypto, pure Rust).
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# File identity (identity.rs): FILE_ID_INFO, OpenFileById, the drive type. Metadata only.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "hub-seed"
path = "src/bin/hub-seed.rs"

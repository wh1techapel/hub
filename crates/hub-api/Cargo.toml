[package]
name = "hub-api"
description = "Hub's local HTTP API for ULTRON: 127.0.0.1 only, a token on every request, the same core services as the UI. No Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hub-core.workspace = true
jiff.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# HTTP on the tokio runtime Tauri already runs (hyper and tokio are in the build through Tauri).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# 32 random bytes for the token, from the operating system.
getrandom = "0.3"

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["net", "sync", "time", "rt", "rt-multi-thread", "macros", "io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"

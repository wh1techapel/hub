[package]
name = "hub-mcp"
description = "The stdio bridge between Claude Code (MCP) and Hub Studio's local API. Thin: tools map to REST calls; every rule lives in Hub."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hub_mcp"
path = "src/lib.rs"

[[bin]]
name = "hub-mcp"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The official MCP SDK: the stdio server, #[tool] macros, input schemas through schemars.
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "fs"] }
# Plain HTTP to 127.0.0.1 only: no TLS, and no proxy (the system proxy must never see the token).
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[dev-dependencies]
hub-core.workspace = true
hub-api.workspace = true
jiff.workspace = true
tempfile.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
